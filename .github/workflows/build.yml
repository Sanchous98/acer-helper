name: build

# One workflow, two jobs that run IN PARALLEL (GitHub parallelises jobs; steps within a job are sequential):
#   • windows — Native-AOT AcerHelper.exe + a WiX MSI installer, on a Windows runner
#   • linux   — the repository's Dockerfile builds the portable (Native AOT) app; the AppImage is packed from
#               the publish folder that build exports
# Both app artefacts are Native AOT (analyzer clean, 0 IL30xx on both TFMs). Each job attaches its output to the
# GitHub Release (the feed the in-app update check + AppImage self-update read). They stay separate jobs (not one
# matrix) because the Windows artefact cannot leave Windows at all: WiX is a Windows tool, and Native AOT
# refuses to cross-compile win-x64 from Linux — the toolchain's own refusals are quoted in docs/build-image.md.
# The windows job's steps are therefore unchanged by the containerisation: same runner, same commands.
#
# The linux job builds nothing itself. The one artefact the image builds is built by it, in one
# `docker buildx build`, so the toolchain (SDK, clang) is pinned inside the image instead of being installed on
# the runner: that job has no .NET setup, no dnf/apt step and no job-level container left. Its own part is to
# run the build, pack the AppImage out of the exported folder, and hand that to the release.
#
# RUNS ONLY on a v* tag: a build's sole purpose is to produce a release, so plain pushes to master don't
# build (no point building the same commit twice — once on the branch push, once on the tag). The release
# assets ARE the deliverable, so no APP artefact is routed through the Actions artifact cache — the MSI and the
# AppImage go straight to the GitHub Release. (The ONE exception is the plugin: task D3 routes the per-OS signed
# plugin + its one-entry manifest fragment from the windows/linux jobs to the small `plugins-manifest` job below
# via upload-artifact/download-artifact, because that job must see BOTH OSes' output to write one
# `vendor-plugins.json`. The plugin assets themselves still go straight to the Release from the aggregate job.)
# workflow_dispatch is kept for a manual build-only smoke test off a branch (the tag-guarded verify/release
# steps just skip there).
#
# AOT is safe here: WMI via source-generated COM interop ([GeneratedComInterface], raw VARIANT/SAFEARRAY),
# NOT System.Management (classic COM interop AOT can't do); HidSharp is rooted (TrimmerRootAssembly) so RGB
# survives trimming. WiX 5 is pinned to avoid the paid OSMF-EULA that WiX 6/7 require.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  windows:
    name: AcerHelper.exe + MSI
    runs-on: windows-2022
    permissions:
      contents: write        # create/attach to the GitHub Release on a version tag
    steps:
      - uses: actions/checkout@v7

      # Guard the in-app update check: it compares the GitHub release tag against the version baked into the
      # binary (AppInfo.Version, generated from csproj <Version>). If a v* tag is pushed WITHOUT bumping
      # <Version>, the shipped build advertises a lower version than its own release tag and every client is
      # offered a perpetual "update" to the build it already runs (and WiX MajorUpgrade won't replace the prior
      # install because ProductVersion — also from <Version> — didn't rise). Fail fast before building.
      - name: Verify tag matches csproj <Version>
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          # Anchor on </Version> so we match ONLY the real element, not the literal "<Version>" that appears in
          # this file's own explanatory comments.
          $ver = [regex]::Match((Get-Content AcerHelper.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          if ($ver -ne $tag) { throw "Release tag v$tag does not match csproj <Version> ($ver). Bump <Version> to $tag before tagging." }
          Write-Host "OK: tag matches <Version> = $ver"

      # Cache the NuGet global-packages folder. The heavy restore cost here is the Native-AOT toolchain
      # (Microsoft.DotNet.ILCompiler + the win-x64 runtime pack) plus Avalonia/HidSharp/CommunityToolkit and the
      # WiX tool package — all immutable, versioned packages, so caching them is safe. Keyed on the csproj (the
      # PackageReferences live there); the restore-keys fallback keeps the cache warm even when only <Version>
      # changed for a release, so restore still finds every package and downloads nothing new.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # THE .resx / AOT SATELLITE PROBE — the one thing that decides whether the app
      # may drop its compiled-in translation tables for the conventional ResourceManager
      # + satellite model. It is a tiny dependency-free console app with a neutral
      # Strings.resx and a Strings.ru.resx satellite; this step publishes it Native AOT
      # (exactly the shipping configuration) and RUNS it, so a satellite that fails to
      # load — the silent-English fallback the whole question is about — fails the build.
      # The probe exits nonzero on a missing OR neutral-fallback value, so "green here"
      # is a measured answer, not a compile-only hope. It is built to its own -o probe
      # folder so it never mixes with the app's publish output. See tests/LocalizationAotProbe.
      - name: Verify .resx loads under Native AOT (probe)
        run: >
          dotnet publish tests/LocalizationAotProbe/LocalizationAotProbe.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishAot=true
          -o probe
          && probe\LocalizationAotProbe.exe

      # The PawnIO driver installer, for the CPU undervolt's one-click setup offer. Fetched pinned rather than
      # committed (3.4 MB, proprietary freeware); the RyzenSMU module it pairs with is fetched at *build* time
      # from its own upstream (AcerHelper.csproj -> FetchRyzenSMu, below), and the reasoning for treating the two
      # differently is in third-party/README.md. Redistribution is granted by the binary itself
      # ("This installer can be redistributed unmodified."), so it travels untouched and the app only ever INVOKES
      # it — never unpacks it, never upgrades it, never removes it.
      # Both guards are fail-the-build, not warn: a hash mismatch means these are not the bytes the feature was
      # written against, and a bad signature means the payload is not the author's.
      - name: Fetch PawnIO installer (pinned)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/namazso/PawnIO.Setup/releases/download/2.2.0/PawnIO_setup.exe'
          $path = 'third-party/PawnIO_setup.exe'
          $want = '1F519A22E47187F70A1379A48CA604981C4FCF694F4E65B734AAA74A9FBA3032'

          Invoke-WebRequest -Uri $url -OutFile $path
          $got = (Get-FileHash $path -Algorithm SHA256).Hash
          if ($got -ne $want) {
            Write-Host "::error::$path hash mismatch. Expected $want, got $got"
            exit 1
          }
          $sig = Get-AuthenticodeSignature $path
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::PawnIO_setup.exe signature is $($sig.Status)"
            exit 1
          }
          Write-Host "PawnIO_setup.exe OK ($got), signed by: $($sig.SignerCertificate.Subject)"

          # The LGPL 2.1 text the embedded RyzenSMU module is licensed under. Fetched rather than committed so the
          # licence is never a hand-copied approximation, and shipped beside the app because the licence has to
          # accompany the binary we convey. The grep is the 404 guard.
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/namazso/PawnIO.Modules/main/COPYING' `
                            -OutFile third-party/RyzenSMU.COPYING
          if (-not (Select-String -Path third-party/RyzenSMU.COPYING -Pattern 'LESSER GENERAL PUBLIC LICENSE' -Quiet)) {
            Write-Host "::error::RyzenSMU.COPYING does not look like the LGPL text"
            exit 1
          }
          Write-Host "RyzenSMU.COPYING OK"

      # The RyzenSMU module itself is fetched during the publish below (AcerHelper.csproj -> FetchRyzenSMu), so
      # cache its version-keyed object cache across runs. The key rolls per run and restore-keys picks up the
      # newest previous cache: the release API is still queried every build so "latest" really is latest, but the
      # module zip is only re-downloaded when a new tag appears. The Linux job never fetches it.
      - name: Cache RyzenSMU module
        uses: actions/cache@v4
        with:
          path: obj/ryzensmu
          key: ryzensmu-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ryzensmu-${{ runner.os }}-

      # GH_TOKEN authorises the release-API call the fetch makes during this publish (unauthenticated GitHub API
      # calls are 60/hour per IP, which a shared runner can exhaust). It is optional to the script: without it the
      # fetch still works, and if upstream is unreachable the cached module or a clean skip is used.
      - name: Publish (self-contained, Native AOT)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet publish AcerHelper.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          --self-contained true
          -p:PublishAot=true
          -o publish

      # Installer: WiX MSI (packaging/AcerHelper.wxs) — harvests publish/ into Program Files + a Start-menu
      # shortcut + uninstaller. Version read from the csproj. (Native AOT + Avalonia is NOT single-file:
      # Skia/HarfBuzz/ANGLE ship as native DLLs next to the exe — libSkiaSharp.dll, libHarfBuzzSharp.dll,
      # av_libGLESv2.dll, libEGL.dll, … — which the WiX harvest below bundles alongside it; the .pdb is dropped.)
      - name: Build MSI (WiX)
        shell: pwsh
        run: |
          Remove-Item publish\*.pdb -ErrorAction SilentlyContinue
          # The PawnIO installer rides along in the install folder so the app can offer a one-click install; the
          # <Files Include="$(var.PublishDir)\**"> harvest below picks it up, so no .wxs change is needed. The module
          # is already inside the exe as a resource and must NOT be copied here as well.
          Copy-Item third-party\PawnIO_setup.exe publish\ -Force
          # The module's licence ships with the binary it covers (the module itself is inside the exe as a resource).
          Copy-Item third-party\RyzenSMU.COPYING publish\ -Force
          dotnet tool install --global wix --version 5.0.2
          # Anchor on </Version> so a "<Version>" mention in a csproj comment can't be picked up instead.
          $ver = [regex]::Match((Get-Content AcerHelper.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          # Absolute PublishDir: WiX resolves a relative <Files Include> against the .wxs folder (packaging\),
          # not the repo root, so a bare "publish" harvested nothing -> an empty ~32 KB MSI.
          wix build packaging\AcerHelper.wxs -arch x64 -d Version=$ver -d "PublishDir=$PWD\publish" -o AcerHelper-Setup.msi

      # ================================ VENDOR PLUGIN (win-x64) ==============================================
      # docs/vendor-plugins.md §5.2 (asset naming), §5.4 (signing), §5.5 (CI), task D3.
      #
      # TAG-ONLY (§5.5). The plugin is a release deliverable published BESIDE the MSI, so a branch
      # workflow_dispatch (a build-only smoke test) neither spends Native AOT minutes nor needs the signing
      # secret. This mirrors the tag guard the MSI/AppImage steps already use, so a branch run simply skips the
      # plugin — the same posture, not a new one. Windows builds the win-x64 half because Native AOT cannot
      # cross-compile (docs/build-image.md:99-150); the linux job builds the .so half.
      #
      # NO COPY INTO publish/ — the MSI must not carry a plugin (§5). The WiX harvest of publish\** (below) is
      # untouched and this output lands in out/plugin-win, a folder the MSI never sees.
      - name: Publish acer-nitro plugin (Native AOT, win-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish plugins/AcerHelper.Vendor.acer-nitro/AcerHelper.Vendor.acer-nitro.csproj
          -c Release
          -f net10.0-windows
          -r win-x64
          --self-contained true
          -p:PublishAot=true
          -o out/plugin-win

      # Fail loudly on a missing/empty native DLL BEFORE signing (the plugin-soak.yml guard, by name; -not plus
      # a length check, because a 0-byte file is not an artefact). A silent sign of nothing would attach an empty
      # asset to the release.
      - name: Verify the plugin publish produced a native DLL
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $plugin = 'out/plugin-win/AcerHelper.Vendor.acer-nitro.dll'
          if (-not (Test-Path $plugin) -or (Get-Item $plugin).Length -eq 0) {
            Write-Host "::error::the plugin publish produced no non-empty '$plugin'"
            Get-ChildItem out/plugin-win -ErrorAction SilentlyContinue | Format-Table Name, Length
            exit 1
          }
          Write-Host "OK: $plugin ($((Get-Item $plugin).Length) bytes)"

      # Normalise to the §5.2 release asset name <AssemblyName>-<os>-<arch>.<ext> BEFORE signing, so the file
      # name on the release, the `asset`/`url` in the manifest and the host's downloaded name are ONE name. The
      # Native AOT publish names the file after the assembly (AcerHelper.Vendor.acer-nitro.dll); the canonical
      # asset name adds the os/arch. Do not keep both: a release whose asset is named differently from the
      # manifest's `asset` makes the manifest's url 404.
      - name: Rename the plugin to its canonical release asset name
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Move-Item -Force 'out/plugin-win/AcerHelper.Vendor.acer-nitro.dll' `
                          'out/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll'
          Write-Host "canonical asset: AcerHelper.Vendor.acer-nitro-win-x64.dll"

      # Sign (§5.4). The private key is the GitHub Actions secret PLUGIN_SIGNING_KEY (PKCS#8 DER, base64); it is
      # NOT in the repo, and the public half is embedded in the host (PluginPublicKeys.ReleaseKeyId =
      # "2026-09-release"). FAIL LOUDLY if it is absent: a release with an unsigned plugin is worse than a failed
      # build (owner decision, task D3). tools/PluginSign SOURCE-INCLUDES the host's own PluginSignature/
      # PluginCatalog, so the canonical string cannot drift from the verifier, and it self-verifies with
      # PluginSignature.Verify/VerifyBinary before writing anything.
      #
      # version = the app <Version> (not a second plugin version): the tag guard above already proved
      # <Version> == the git tag, so this is the release version the manifest advertises; minHost below is the
      # floor the plugin actually needs.
      - name: Sign acer-nitro plugin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLUGIN_SIGNING_KEY)) {
            Write-Host "::error::PLUGIN_SIGNING_KEY is not set. A v* tag release must sign its plugins (docs/vendor-plugins.md §5.4/§5.5)."
            exit 1
          }
          # Anchor on </Version> so a "<Version>" mention in a csproj comment can't be picked up instead (same
          # idiom as the tag guard and the MSI step).
          $version = [regex]::Match((Get-Content AcerHelper.csproj -Raw), '<Version>([^<]+)</Version>').Groups[1].Value
          # The exact browser_download_url base for this tag, so the manifest's url/sig are the real release
          # URLs and the host never assembles a URL from parts (§5.2).
          $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          # minHost is the app <Version> where plugin support first lands (the whole distribution/loader stack is
          # in this tree at 0.37.0, AcerHelper.csproj:12), NOT the doc's hypothetical "0.38.0" sample: the
          # selector accepts minHost == the host version, so a floor of 0.37.0 can never EXCLUDE the host that
          # ships the plugin (a floor above the tagged <Version> would), while any later host satisfies it too.
          dotnet run --project tools/PluginSign/PluginSign.csproj --configuration Release -- sign `
            --asset out/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll `
            --out out/plugin-win/vendor-plugins-fragment.json `
            --sig-out out/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll.sig `
            --id acer-nitro --vendor acer --os win --arch x64 `
            --version $version --api-major 1 --api-minor 0 --min-host 0.37.0 `
            --hint-manufacturer Acer --hint-product Nitro --hint-product AN18 `
            --base-url $base --key-id 2026-09-release

      # Hand the signed plugin + its one-entry fragment to the aggregate job. This is the ONE artifact hop in
      # this file (see the header): `plugins-manifest` must see BOTH OSes' output to write one vendor-plugins.json.
      - name: Upload the signed win-x64 plugin to the aggregate job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-win          # `plugins-manifest` downloads by this name (no merge-multiple, so the two
                                    # OSes cannot collide on the identically-named fragment file)
          path: |
            out/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll
            out/plugin-win/vendor-plugins-fragment.json
            out/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll.sig

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AcerHelper-Setup.msi

  linux:
    name: AppImage (container build)
    # No job-level `container:` any more, and this is not tidying: the fedora:41 container existed for the build
    # — clang and zlib for the AOT link — and that build is the image's now, with its toolchain pinned there
    # instead of installed per run. It cannot stay as an empty shell around the packaging either, because buildx
    # reaches the Docker daemon and BuildKit through the runner (its steps would run inside fedora, with no
    # docker CLI and no socket). Packing an AppImage needs nothing fedora provided.
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the AppImage to the GitHub Release on a version tag
    steps:
      - uses: actions/checkout@v7

      # Same guard as the windows job: a v* tag pushed without bumping csproj <Version> would ship an AppImage
      # whose baked-in AppInfo.Version is below its own release tag, perpetually offering an "update" to itself.
      - name: Verify tag matches csproj <Version>
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # Anchor on </Version> (lookahead) so we match ONLY the real element, not the literal "<Version>" that
          # appears in this file's own explanatory comments — grep -o would otherwise emit every occurrence.
          ver=$(grep -oP '<Version>\K[^<]+(?=</Version>)' AcerHelper.csproj | head -1)
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then echo "Release tag v$tag does not match csproj <Version> ($ver). Bump <Version> to $tag before tagging."; exit 1; fi
          echo "OK: tag matches <Version> = $ver"

      # Cached layers are the reason a normal run is not a multi-GB pull: the runner's default builder is the
      # `docker` driver, which cannot export to the Actions cache, and the gha backend needs a builder backed by
      # BuildKit in a container — which is what this action creates (docker-container is its default driver).
      # buildx ships with the runner, so nothing is installed here.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # The build, verbatim as docs/build-image.md documents it: one invocation, and the container's own
      # `artefacts` stage decides the layout — dist/linux (the publish folder this job packs the AppImage from)
      # and dist/PROVENANCE.txt. What the image pins is in that document; this job installs no toolchain because
      # it needs none.
      #
      # GIT_SHA is handed in because .git is deliberately outside the build context (.dockerignore), so the image
      # cannot read the revision for itself — and a release folder that cannot name the commit it came from is
      # not auditable.
      #
      # mode=max is required, not a tuning knob: the exported `artefacts` stage is scratch plus two COPYs, so
      # the default mode=min would push almost nothing to the cache, while every expensive layer (the apt-get
      # run in dotnet-base, the NuGet fetch, the AOT link) lives in a stage it drops.
      #
      # A failure here fails the job — no continue-on-error, no `|| true`: an artefact that quietly did not get
      # built is the one outcome this job must never produce.
      - name: Build the Linux app in the release image
        run: >
          docker buildx build
          --target artefacts
          --output type=local,dest=dist
          --build-arg GIT_SHA=${{ github.sha }}
          --cache-from type=gha
          --cache-to type=gha,mode=max
          .

      # Every step below reads these paths, and `--output type=local` writes whatever the stage holds — including
      # nothing, if the export went wrong. Checked here, by name, so a bad export fails where it can say what is
      # missing instead of failing at appimagetool with a message about an AppDir. -s rather than -e: an empty
      # file is not an artefact either.
      - name: Verify the container exported the artefact
        run: |
          for f in dist/linux/AcerHelper dist/PROVENANCE.txt; do
            [ -s "$f" ] || { echo "::error::the release image did not export $f"; exit 1; }
          done
          ls -l dist/linux

      # Cache appimagetool (continuous) so we don't re-fetch it from GitHub on every build — also removes a
      # network dependency that has flaked before. Static key = pinned; bump it to pick up a newer appimagetool.
      - name: Cache appimagetool
        uses: actions/cache@v4
        with:
          path: appimagetool
          key: appimagetool-continuous-x86_64

      # AppImage: bundle the whole AOT output the image exported (native AcerHelper + libSkiaSharp.so /
      # libHarfBuzzSharp.so — not single-file, like the Windows AOT publish; drop the .dbg/.pdb) plus the udev
      # rules (installed on first run via the in-app pkexec). The three permission/options files are ALREADY in
      # dist/linux: the csproj carries them as Linux-only Content items with CopyToPublishDirectory, so every
      # publish — this one, a local one, the RPM — brings them without anyone copying them in. The cp below
      # therefore re-copies the same bytes; it is kept because the AppDir layout is this step's business and an
      # AppImage missing them loses the whole "Grant hardware access" offer silently. dist/linux is the publish
      # folder the `artefacts` stage lays out, so this step no longer knows where a publish happened. appimagetool
      # with --appimage-extract-and-run, as it ran in the container this step used to be in: no FUSE dependency.
      # appimagetool also REQUIRES `file` to inspect the AppDir (it aborts with "file command is missing but
      # required" — the minimal fedora image had to be given it); the ubuntu runner image carries it as a
      # default-installed package, and that is the one thing here resting on the image rather than a step.
      - name: Build AppImage
        run: |
          rm -f dist/linux/*.dbg dist/linux/*.pdb
          AD=AcerHelper.AppDir
          mkdir -p "$AD"
          cp -a dist/linux/. "$AD/"
          chmod +x "$AD/AcerHelper"
          install -m0755 packaging/AppRun "$AD/AppRun"
          cp packaging/acer-helper.desktop "$AD/"
          cp packaging/acer-helper.png "$AD/"
          cp packaging/60-acer-helper.rules packaging/acer-helper.conf packaging/acer-helper-smu-perms.service packaging/acer-helper-modprobe.conf "$AD/"
          # Reuse the cached appimagetool if the cache restored it; otherwise fetch it.
          [ -x appimagetool ] || curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$AD" AcerHelper-x86_64.AppImage

      # ================================ VENDOR PLUGIN (linux-x64) ===========================================
      # docs/vendor-plugins.md §5.2/§5.4/§5.5, task D3. TAG-ONLY, for the reason the windows job states: the
      # plugin is a release deliverable and a branch dispatch neither needs the secret nor should spend AOT
      # minutes.
      #
      # TOOLCHAIN DECISION — a PLAIN ubuntu-latest job with clang/binutils/zlib1g-dev, NOT the release Docker
      # image, exactly as .github/workflows/plugin-soak.yml §linux decided (its header, lines 111-125). REASONS,
      # restated for this job: (a) the image's `artefacts` stage exists to export the APP's publish folder;
      # routing a second publish through it means editing Dockerfile — a file this task must not touch, and a
      # change that would entangle the plugin with the app release the image is pinned for; (b) the only thing
      # the image pins for Linux AOT is the documented prerequisite set — clang, binutils, zlib1g-dev — which is
      # a two-line apt-get here; (c) the plugin is a small shared library, so the image's multi-GB BuildKit cache
      # (for the app's far larger AOT link) buys nothing. The .NET SDK comes from actions/setup-dotnet, the same
      # action the windows job uses.
      - name: Setup .NET 10 (for the plugin)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # The documented Ubuntu Native AOT prerequisites (docs/build-image.md): clang is the AOT compiler/linker
      # driver, zlib1g-dev is what the runtime's native libraries link against, binutils supplies the symbol
      # stripper. Same set plugin-soak.yml installs on this same runner.
      - name: Install Native AOT prerequisites (for the plugin)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang binutils zlib1g-dev

      # The Linux half of the plugin: net10.0 (the plugin's portable TFM) → AcerHelper.Vendor.acer-nitro.so.
      # net10.0-windows is refused on Linux (Native AOT cannot cross-compile, docs/build-image.md:99-150), which
      # is why this job uses the portable TFM and produces a .so.
      - name: Publish acer-nitro plugin (Native AOT, linux-x64)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish plugins/AcerHelper.Vendor.acer-nitro/AcerHelper.Vendor.acer-nitro.csproj
          -c Release
          -f net10.0
          -r linux-x64
          --self-contained true
          -p:PublishAot=true
          -o out/plugin-linux

      # Same fail-loud artefact guard as the windows job, with -s (non-empty) instead of -e.
      - name: Verify the plugin publish produced a native .so
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          plugin=out/plugin-linux/AcerHelper.Vendor.acer-nitro.so
          [ -s "$plugin" ] || { echo "::error::the plugin publish produced no non-empty $plugin"; ls -l out/plugin-linux; exit 1; }
          ls -l "$plugin"

      # Normalise to the §5.2 canonical asset name <AssemblyName>-<os>-<arch>.<ext> BEFORE signing, so the file
      # name on the release, the `asset`/`url` in the manifest and the host's downloaded name are ONE name (the
      # Windows job does the same; see its step for the 404 the mismatch would cause).
      - name: Rename the plugin to its canonical release asset name
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mv out/plugin-linux/AcerHelper.Vendor.acer-nitro.so \
             out/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so
          echo "canonical asset: AcerHelper.Vendor.acer-nitro-linux-x64.so"

      # Sign (§5.4) — fail loudly when the secret is absent, same policy as the windows job.
      - name: Sign acer-nitro plugin
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          PLUGIN_SIGNING_KEY: ${{ secrets.PLUGIN_SIGNING_KEY }}
        run: |
          if [ -z "$PLUGIN_SIGNING_KEY" ]; then
            echo "::error::PLUGIN_SIGNING_KEY is not set. A v* tag release must sign its plugins (docs/vendor-plugins.md §5.4/§5.5)."
            exit 1
          fi
          # Anchor on </Version> (lookahead) so a "<Version>" mention in a csproj comment can't be picked up
          # instead — the same idiom as this job's tag guard above.
          version=$(grep -oP '<Version>\K[^<]+(?=</Version>)' AcerHelper.csproj | head -1)
          base="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # minHost = 0.37.0, the app <Version> where plugin support first lands (AcerHelper.csproj:12), not the
          # doc's hypothetical "0.38.0" sample — see the windows job's sign step for the full reasoning.
          dotnet run --project tools/PluginSign/PluginSign.csproj --configuration Release -- sign \
            --asset out/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so \
            --out out/plugin-linux/vendor-plugins-fragment.json \
            --sig-out out/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so.sig \
            --id acer-nitro --vendor acer --os linux --arch x64 \
            --version "$version" --api-major 1 --api-minor 0 --min-host 0.37.0 \
            --hint-manufacturer Acer --hint-product Nitro --hint-product AN18 \
            --base-url "$base" --key-id 2026-09-release

      - name: Upload the signed linux-x64 plugin to the aggregate job
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-linux
          path: |
            out/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so
            out/plugin-linux/vendor-plugins-fragment.json
            out/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so.sig

      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: AcerHelper-x86_64.AppImage

  # ================================ VENDOR PLUGIN MANIFEST (aggregate) ======================================
  # docs/vendor-plugins.md §5.2 (the manifest), §5.5 (the aggregate job), task D3. A small job that `needs` both
  # plugin builds, downloads their signed artefacts + one-entry fragments, merges them into the single
  # `vendor-plugins.json` the host fetches (§5.2), and attaches the plugin assets, their `.sig` files and the
  # manifest to the SAME release the two jobs above attach to.
  #
  # WHY A SEPARATE JOB AND NOT A STEP: writing one manifest needs BOTH OSes' output, which live in two different
  # runners. The Actions artifact cache is the only correct way to move them (see the header). It runs ONLY on a
  # v* tag, so `needs` never gates a branch dispatch — the plugin jobs skip there and this job is skipped too.
  #
  # THE DEPRECATED-MAJOR CI LEG (§5.5, §3.8.3) IS DELIBERATELY ABSENT. Only API major 1 exists today (the host's
  # PluginApiVersion is 1.0, SupportedMajors = {1}), so there is no deprecated major to build a second leg for.
  # Adding a second `publish -p:AcerNitroApiMajor=<deprecated>` leg and a second manifest entry per OS is owed
  # to the PR that bumps the host's major (it makes the previous major deprecated); the same PR deletes the leg
  # at the removal trigger. Leaving it out now avoids building an unused fixture. See also plugin-soak.yml's NOTE
  # on its own omitted refusal leg — the same "do not build a fixture with no consumer" rule.
  plugins-manifest:
    name: vendor-plugins.json
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the plugin assets + manifest to the GitHub Release on a version tag
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # Download each OS's artefact by its own artifact name. No merge-multiple: both fragments are named
      # `vendor-plugins-fragment.json`, so merging would overwrite one with the other; the aggregate step below
      # passes both explicit paths instead.
      - name: Download the win-x64 plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-win
          path: artifacts/plugin-win

      - name: Download the linux-x64 plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-linux
          path: artifacts/plugin-linux

      # Merge the two one-entry fragments into one vendored manifest through the signer's `manifest` mode, which
      # RE-VERIFIES every merged entry with the host's PluginSignature.Verify (fail-closed) before writing. The
      # signer source-includes the host's PluginCatalog/PluginSignature, so the manifest is written and checked
      # with the exact code the shipped host verifies with (§5.4) — no secret is needed here: verification uses
      # the embedded public key.
      - name: Merge the per-OS fragments into vendor-plugins.json
        run: |
          dotnet run --project tools/PluginSign/PluginSign.csproj --configuration Release -- manifest \
            --fragment artifacts/plugin-win/vendor-plugins-fragment.json \
            --fragment artifacts/plugin-linux/vendor-plugins-fragment.json \
            --out vendor-plugins.json
          test -s vendor-plugins.json || { echo "::error::the aggregate produced no vendor-plugins.json"; exit 1; }

      # Attach the two plugin assets, their detached `.sig` files and the manifest to the SAME release the
      # windows/linux jobs already attach to (softprops/action-gh-release@v3, matching their `contents: write`).
      # The explicit file list — not a glob — so a missing artefact fails the release lookup rather than silently
      # publishing a partial set.
      - name: Release (on tag)
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll
            artifacts/plugin-win/AcerHelper.Vendor.acer-nitro-win-x64.dll.sig
            artifacts/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so
            artifacts/plugin-linux/AcerHelper.Vendor.acer-nitro-linux-x64.so.sig
            vendor-plugins.json
