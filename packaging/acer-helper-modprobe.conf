# AcerHelper — the acer-wmi module parameters, applied at module load. Installed as
# /etc/modprobe.d/acer-helper.conf (the bundled name carries "-modprobe" only because packaging/acer-helper.conf
# is the tmpfiles.d file; two files of one name in the AppImage/publish folder would collide).
#
# ONE options line, deliberately. Several "options acer_wmi ..." lines for one module have ambiguous merge
# semantics that vary with the kmod version (some keep the first, some the last), so a second line here would
# silently disarm this one. New parameters belong appended to THIS line.

# PROVENANCE — re-derive, never copy:
#   kernel   7.2.4-ogc3.1.fc44.x86_64 — the build both values were measured on
#   machine  DMI "Acer Nitro AN18-61" (sys_vendor=Acer, product_name=Nitro AN18-61)
#   measured 2026-09-20, by a before/after inventory diff of the module's whole surface plus a bounded fan
#            write test — and, for force_caps, by comparing candidate values against each other (both recorded
#            below)
#   upstream commit f9124f2a, "platform/x86: acer-wmi: Add predator_v4 module parameter" — added precisely so
#            laptops outside the driver's DMI quirk table can use these features; the whitelisted models get
#            the same flag from acer_quirks instead (e.g. quirk_acer_nitro_an515_58 = { .predator_v4 = 1,
#            .pwm = 1 }).

# predator_v4=1 — WHAT IT TURNS ON: the predator v4 platform-profile set on the vendor handler
# (platform-profile-1/profile offers five choices — low-power, quiet, balanced, balanced-performance,
# performance, where "performance" is Turbo) plus the hwmon chip's fan/temperature telemetry (fan1_input,
# fan2_input, temp1..temp3). Without it the vendor handler keeps the three default choices and the chip has no
# fan or sensor channels at all: this machine's DMI is not in the driver's table, so the features are present in
# the module but stay switched off.

# force_caps=7200 (0x1C20) — WHAT IT TURNS ON, on top of the above: fan CONTROL. The hwmon chip gains
# pwm1, pwm1_enable, pwm2 and pwm2_enable (the measured names are pwmN / pwmN_enable — this build writes the
# duty to pwmN, there is no pwmN_input), which is the kernel's own gaming-WMI path: the same GUID and the same
# speed/behaviour methods the Windows backend drives.
#
# THE VALUE IS A WHOLE-MASK REPLACEMENT, NOT AN OR, and that is the only way to read it: the module assigns it
# (`interface->capability = force_caps`), so every bit that must survive has to be present in the number.
# Derived on this machine, then CONFIRMED ON THE MACHINE, as:
#     ACER_CAP_SET_FUNCTION_MODE          0x0020   (this machine has ACER_WMID3)
#   | ACER_CAP_PLATFORM_PROFILE           0x0400
#   | ACER_CAP_HWMON                      0x0800
#   | ACER_CAP_PWM                        0x1000   (the bit this file exists to add — no DMI entry means no
#                                                   quirk supplies it, and without it the pwm nodes never appear)
#   =                                     0x1C20 = 7200
#
# 7206 (0x1C26) IS FALSIFIED ON HARDWARE, and HOW it fails is the lesson. It looks like the safer number: it
# also sets the interface descriptor's WIRELESS | BLUETOOTH bits (0x6, ACER_CAP_WIRELESS | ACER_CAP_BLUETOOTH,
# read out of `wmid_v2_interface.capability`), as if that "preserved" what the driver would have computed. It
# does not preserve anything — with 7206 acer-wmi registers TWO PHANTOM rfkill devices under
# /sys/devices/platform/acer-wmi/rfkill/, `acer-wireless` (wlan) and `acer-bluetooth` (bluetooth), and EVERY
# module load logs three failures:
#     acer_wmi: Get 0x1 Device Status failed: 0xe2 - 0x0
#     acer_wmi: Get 0x800 Device Status failed: 0xe2
#     acer_wmi: Get Current Device Status failed: 0xe2
# With 7200 those devices do not exist at all — rfkill is just hci0/phy0, the wifi and Bluetooth drivers' own
# devices — and no such line is logged; with no force_caps either (predator_v4 alone) they do not exist either.
# So this machine's REGISTERED capability does not contain WIRELESS | BLUETOOTH: the descriptor bits do not
# survive into the device that gets registered, and 0x1C26 does not keep them alive — it CREATES two devices
# whose own status probe fails.
#
# BOTH NUMBERS IN THE PARAGRAPH ABOVE ARE CORRECTED, and this file is where they were wrong: the first version
# read "7206 (0x1C23)" and "(0x3, ACER_CAP_WIRELESS | ACER_CAP_BLUETOOTH)". 7200 is 0x1C20, so 7206 is 0x1C26
# (0x1C23 is 7203), and the pair's bits are 0x6 — ACER_CAP_MAILLED is BIT(0) 0x1, ACER_CAP_WIRELESS BIT(1) 0x2
# and ACER_CAP_BLUETOOTH BIT(2) 0x4, so 0x3 would name MAILLED | WIRELESS. The shipped mask is unaffected
# (force_caps=7200 above, and 7206 was falsified whatever its hex read as). What the corrected label rests on is
# not the arithmetic but the measurement below: the two devices 7206 brings into existence are `acer-wireless`
# and `acer-bluetooth`, which is the pair that 0x6 names.
#
# THE GENERAL LESSON, and why every number here is a measurement rather than a calculation: reading the driver's
# ORs is not enough, because a capability bit that reaches the mask does not necessarily survive into the device
# that gets registered. A mask value must be confirmed by a before/after INVENTORY DIFF on the machine — rfkill
# names, backlight, leds, both platform-profile handlers and their choices, the hwmon channels, the WMI hotkeys
# and the journal — never by arithmetic alone. (No TURBO_OC / TURBO_LED / TURBO_FAN bits either: they open EC
# write paths on models upstream did not whitelist.)
#
# MEASURED EVIDENCE (2026-09-20, kernel and DMI above, one install, only the number differing):
#   appeared   with force_caps at all (7200 and 7206 alike): pwm1, pwm1_enable, pwm2 and pwm2_enable under
#              /sys/devices/platform/acer-wmi/hwmon/hwmonN/, chgrp wheel + g+w once the rule in
#              packaging/60-acer-helper.rules has run
#   lost       nothing with 7200: rfkill list, /sys/class/backlight, /sys/class/leds, /sys/class/rfkill/*/name,
#              both platform-profile handlers and their choices (platform-profile-0: low-power/balanced/
#              performance; platform-profile-1: the vendor five), the acer hwmon channels and the Acer WMI
#              hotkeys were byte-for-byte identical before and after, and `journalctl -b -k` gained no ACPI/WMI
#              error
#   gained     with 7206 ONLY: the two phantom rfkill devices (acer-wireless, acer-bluetooth) and the three
#              0xe2 status-failure lines above, once per module load — the whole reason the value is 7200
#   write      real, through the kernel's gaming-WMI path: CPU fan 1920 -> 5085 rpm at MAX, GPU 619 -> 4510 rpm
#              at MAX, and exactly 0 rpm at duty 0

# A KERNEL BUMP OR A DIFFERENT MODEL INVALIDATES BOTH VALUES. predator_v4 is a whitelist override, so what it
# opens depends on the driver build AND on the machine (a newer acer-wmi may have gained this model's DMI entry,
# in which case the line does nothing useful, or restructured the flag). force_caps is a whole-mask replacement
# whose correct value is machine-specific, and the 7206 episode above shows it cannot be reasoned out of the
# sources either: re-derive it on the machine — `modinfo -p acer_wmi` for the parameters, the acer_quirks table
# and the capability #defines for a CANDIDATE mask, then a before/after inventory diff (rfkill, backlight, leds,
# platform-profile, hwmon, journal) to confirm the candidate — rather than copying this line forward, and never
# from the sum alone.
options acer_wmi predator_v4=1 force_caps=7200
