# AcerHelperLampArray, in Rust — the same driver package as driver/AcerHelperLampArray/, built by cargo.
#
# This crate sits BESIDE the C driver, not in place of it: the C one is what ships today and what
# driver/README.md and docs/build-image.md document, and it keeps building exactly as before. See
# docs/rust-driver.md for why there are two, what is shared between them and what is not.
#
# There is no dependency on windows-drivers-rs. Its build-script crate `wdk-build` refuses to compile off
# Windows with an explicit `compile_error!` ("windows-drivers-rs is designed to be run on a Windows host
# machine in a WDK environment"), and `wdk-sys` depends on it at build time, so the whole crate set is
# unreachable from the Linux release image. What is kept from that design is the technique — bindgen against
# the WDK headers, and the KMDF function table — implemented in build.rs.

[package]
name = "acer-helper-lamparray"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "AcerHelperLampArrayRust"
# cdylib, not staticlib: it is what makes rustc drive the link, so build.rs can hand the kernel link flags to
# the linker through `cargo::rustc-cdylib-link-arg` — the same mechanism the WDK's own Rust samples use.
crate-type = ["cdylib"]

[dependencies]

[build-dependencies]
bindgen = "0.72"

[profile.release]
# A kernel driver has nothing to unwind into. This also drops the exception-handling runtime that the
# precompiled core for x86_64-pc-windows-msvc would otherwise reference.
panic = "abort"
lto = true
codegen-units = 1
